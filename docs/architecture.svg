<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">PropManager — System Architecture</text>

  <!-- User -->
  <rect x="370" y="65" width="160" height="45" rx="8" fill="#4263eb" stroke="none"/>
  <text x="450" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="white">👤 User (Browser)</text>

  <!-- Arrow down -->
  <line x1="450" y1="110" x2="450" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- React Frontend -->
  <rect x="300" y="140" width="300" height="50" rx="8" fill="#3b82f6" stroke="none"/>
  <text x="450" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="white">React Frontend</text>
  <text x="450" y="180" text-anchor="middle" font-size="10" fill="#bfdbfe">Vite • Tailwind CSS • React Router</text>

  <!-- Arrow down -->
  <line x1="450" y1="190" x2="450" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FastAPI Backend -->
  <rect x="280" y="220" width="340" height="55" rx="8" fill="#059669" stroke="none"/>
  <text x="450" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="white">FastAPI Backend</text>
  <text x="450" y="262" text-anchor="middle" font-size="10" fill="#a7f3d0">Python • SQLAlchemy • JWT Auth</text>

  <!-- Arrow down to auth -->
  <line x1="350" y1="275" x2="350" y2="305" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="275" x2="450" y2="305" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="275" x2="550" y2="305" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auth/RBAC -->
  <rect x="280" y="305" width="140" height="45" rx="8" fill="#dc2626" stroke="none"/>
  <text x="350" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="white">Auth / RBAC</text>
  <text x="350" y="340" text-anchor="middle" font-size="9" fill="#fecaca">JWT • bcrypt</text>

  <!-- Service Layer -->
  <rect x="430" y="305" width="140" height="45" rx="8" fill="#d97706" stroke="none"/>
  <text x="500" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="white">Services</text>
  <text x="500" y="340" text-anchor="middle" font-size="9" fill="#fde68a">Business Logic</text>

  <!-- API Routes -->
  <rect x="160" y="305" width="110" height="45" rx="8" fill="#7c3aed" stroke="none"/>
  <text x="215" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="white">API Routes</text>
  <text x="215" y="340" text-anchor="middle" font-size="9" fill="#ddd6fe">REST Endpoints</text>

  <!-- Arrow down from services -->
  <line x1="350" y1="350" x2="350" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="350" x2="500" y2="385" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database -->
  <rect x="300" y="385" width="300" height="55" rx="8" fill="#1e293b" stroke="none"/>
  <text x="450" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="white">SQLite Database</text>
  <text x="450" y="425" text-anchor="middle" font-size="10" fill="#94a3b8">SQLAlchemy ORM • Foreign Keys • Constraints</text>

  <!-- External Integrations Box -->
  <rect x="620" y="305" width="230" height="135" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
  <text x="735" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">External Integrations</text>
  
  <!-- Payment Gateway -->
  <rect x="635" y="335" width="200" height="30" rx="5" fill="#e0e7ff"/>
  <text x="735" y="355" text-anchor="middle" font-size="10" fill="#4338ca">💳 Payment Gateway (Sandbox)</text>
  
  <!-- Notifications -->
  <rect x="635" y="370" width="200" height="30" rx="5" fill="#fef3c7"/>
  <text x="735" y="390" text-anchor="middle" font-size="10" fill="#92400e">🔔 Notifications & Reminders</text>

  <!-- Data Relationships Box -->
  <rect x="80" y="460" width="740" height="220" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Data Relationships</text>

  <!-- Entities -->
  <rect x="100" y="495" width="110" height="35" rx="6" fill="#4263eb"/>
  <text x="155" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="white">Users</text>

  <rect x="230" y="495" width="110" height="35" rx="6" fill="#059669"/>
  <text x="285" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="white">Properties</text>

  <rect x="360" y="495" width="110" height="35" rx="6" fill="#d97706"/>
  <text x="415" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="white">Units</text>

  <rect x="490" y="495" width="110" height="35" rx="6" fill="#dc2626"/>
  <text x="545" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="white">Leases</text>

  <rect x="620" y="495" width="110" height="35" rx="6" fill="#7c3aed"/>
  <text x="675" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="white">Payments</text>

  <rect x="360" y="550" width="110" height="35" rx="6" fill="#0891b2"/>
  <text x="415" y="572" text-anchor="middle" font-size="11" font-weight="600" fill="white">Maintenance</text>

  <rect x="490" y="550" width="110" height="35" rx="6" fill="#be185d"/>
  <text x="545" y="572" text-anchor="middle" font-size="11" font-weight="600" fill="white">Notifications</text>

  <!-- Relationship arrows -->
  <line x1="210" y1="512" x2="230" y2="512" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>
  <line x1="340" y1="512" x2="360" y2="512" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>
  <line x1="470" y1="512" x2="490" y2="512" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>
  <line x1="600" y1="512" x2="620" y2="512" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>
  <line x1="155" y1="530" x2="155" y2="567" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="155" y1="567" x2="360" y2="567" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-sm)"/>

  <!-- Legend labels -->
  <text x="155" y="610" text-anchor="middle" font-size="9" fill="#64748b">owner_id → Users</text>
  <text x="285" y="610" text-anchor="middle" font-size="9" fill="#64748b">property_id → Properties</text>
  <text x="415" y="610" text-anchor="middle" font-size="9" fill="#64748b">unit_id → Units</text>
  <text x="545" y="610" text-anchor="middle" font-size="9" fill="#64748b">lease_id → Leases</text>
  <text x="675" y="610" text-anchor="middle" font-size="9" fill="#64748b">tenant_id → Users</text>
  
  <text x="300" y="650" font-size="9" fill="#64748b">User → owns Properties</text>
  <text x="300" y="665" font-size="9" fill="#64748b">Property → has Units</text>
  <text x="500" y="650" font-size="9" fill="#64748b">Unit → has Leases</text>
  <text x="500" y="665" font-size="9" fill="#64748b">Lease → has Payments</text>
  <text x="100" y="650" font-size="9" fill="#64748b">Tenant → creates Maintenance</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
